# claude-usage-monitor configuration TEMPLATE
#
# This file ships in the public repo with placeholder values only.
# To customize WITHOUT committing personal data, copy it to
#   ~/.claude/budget.local.toml
# and edit there. The local override is gitignored and takes precedence.

[alerts]
# Warn when the forecast projects a window will reach this % before it resets.
warn_projected_pct = 90.0
# Treat the window as effectively spent at this observed %.
critical_used_pct = 95.0

# --- Active alerting (alerts.py) ---------------------------------------------
# Master switch for the whole alert engine (detection + delivery). When false,
# no markers and no notifications.
enabled = true
# Fire desktop notify-send notifications. The statusline marker is independent
# and still shows when a condition holds even if this is false (marker-only mode,
# good for headless/SSH sessions where notify-send would no-op anyway).
notify = true
# "Projected WAY over": fire when the budget-burndown forecast projects the
# current FRESH reading to land at/above this %, AND the projection is meaningful
# (past the early-window guard, on_pace != None).
alert_over_pct = 125.0
# "Spiking rapidly": fire when FRESH used% climbs faster than this many
# percentage-points per minute over the trailing spike window.
spike_pp_per_min = 5.0
# Trailing window (seconds) over which the spike slope is measured.
spike_window_seconds = 600.0
# Dedupe bucket (seconds): per bucket keep MAX used% to collapse the ~6-session
# interleave before fitting the slope.
spike_bucket_seconds = 30.0
# Minimum distinct fresh buckets required before a spike can fire (anti-noise).
spike_min_points = 4
# Cooldown (seconds): re-notify the same condition at most once per this interval.
cooldown_seconds = 1800.0
# Hysteresis: stay latched (marker shown) until the metric falls below
# threshold * clear_factor, so it doesn't flap at the boundary.
clear_factor = 0.9
# "Reset after exceeded": notify when a window resets, but ONLY if usage had hit
# the cap during the period that just ended (so you learn usage is available
# again — but only when you'd actually run out).
reset_notify = true
# "Over the limit" cap (%). Reaching this = exceeded. Used by the reset-notify
# gate above AND the dashboard/statusline overage $-tracker.
over_limit_pct = 100.0
# A reset is detected when the FRESH used% drops by at least this many points
# between ticks (a sharp collapse only happens on reset; the rolling counter
# never ages out this fast). The reset time advancing is also accepted, but is
# unreliable — Anthropic may reset usage WITHOUT advancing it.
reset_drop_pp = 40.0

[forecast]
# Each window projects from average pace since it opened (budget burndown).
# These are the total window lengths in seconds (Anthropic: 5h and 7d).
window_5h_seconds = 18000
window_7d_seconds = 604800

# --- Layered projection model (forecast_window) ------------------------------
# Master switch: "layered" uses the new additive/decay projector everywhere;
# "ratio" forces the legacy budget-burndown model (instant rollback / ship dark).
model = "layered"
# Trailing window (sec) over which the L1 OLS rate is fit from fresh used%
# samples (30 min). Steadier than the alerts spike detector's 600s window.
slope_window_seconds = 1800
# Bucket size (sec) for the _bucketed_max dedupe before fitting the rate
# (mirrors alerts.spike_bucket_seconds).
slope_bucket_seconds = 30
# Minimum deduped fresh buckets required to trust the slope; below this
# forecast_window falls back to the ratio model.
slope_min_points = 4
# 5h: how long the live rate is trusted flat before mean-reverting (45 min).
# Caps how far a momentary spike projects.
burst_horizon_seconds = 2700
# 5h: exponential time-constant (sec) for decaying the live rate toward the
# recent baseline after the burst horizon.
revert_tau_seconds = 3600
# If no fresh sample (or no recent spend) within this many seconds, treat the
# account as idle and set the future rate to 0 (project flat).
idle_seconds = 600
# 7d: time-constant (sec, 2 days) for mean-reverting the live rate toward its
# recent baseline over the long horizon, so a live blip fades across the week.
revert_tau_7d_seconds = 172800
# L2 roll-off decay: coarse-bucket the window-spanning cost history to this
# resolution for the aging profile, and walk the forward peak sim in this many
# steps from now -> reset.
decay_bucket_seconds = 900
decay_sim_steps = 24
# Half-width of the projected_low/high band as a fraction of predicted future
# additions (expected +/- 25%); widened automatically when history is thin.
band_frac = 0.25
# Upper clamp on any projected value (matches forecast_from_period_start's cap),
# so a degenerate calibration can't print absurd numbers.
cap = 999.0

# Phase 2 seam: tiered model/effort recommendation by 5-hour window usage.
# Phase 1 only DISPLAYS the recommendation; it does not act on it.
[[policy.tiers]]
max_used_pct = 50.0
model = "opus"
effort = "high"

[[policy.tiers]]
max_used_pct = 80.0
model = "sonnet"
effort = "medium"

[[policy.tiers]]
max_used_pct = 100.0
model = "haiku"
effort = "low"
