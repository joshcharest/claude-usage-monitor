[project]
name = "claude-usage-monitor"
version = "0.1.0"
description = "Self-monitor Claude Code usage vs paid plan windows; forecast pace; (later) manage model/effort"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The dashboard is opt-in so the core tool (statusline + indexer) stays
# zero-runtime-dependency. Install with: uv sync --extra dashboard
dashboard = ["streamlit>=1.40", "altair>=5", "pandas>=2"]

[project.scripts]
claude-usage-statusline = "claude_usage_monitor.statusline:main"
claude-usage-index = "claude_usage_monitor.indexer:main"
claude-usage-dashboard = "claude_usage_monitor.dashboard.launch:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_usage_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
